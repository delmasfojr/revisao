<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Revisão Delmão</title>

<style>
/* tela de carregamento: aparece já no primeiro instante, antes do resto */
#splash{position:fixed;inset:0;z-index:999;background:#0F1B2D;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;transition:opacity .35s}
#splash.sai{opacity:0;pointer-events:none}
#splash .sp-masc{position:relative;width:150px;height:150px;margin-bottom:10px}
#splash .sp-masc::before{content:'';position:absolute;inset:-22px -22px -6px;border-radius:50%;background:#FF7A00;animation:sp-pulsa 1.6s ease-in-out infinite}
#splash .sp-masc img{position:relative;width:100%;height:100%;object-fit:contain;object-position:bottom;animation:sp-pula 1.1s cubic-bezier(.3,1.4,.5,1) infinite alternate}
#splash h1{font:34px 'Anton',Impact,sans-serif;text-transform:uppercase;margin:6px 0 0;letter-spacing:.5px;line-height:1}
#splash h1 span{color:#FF7A00}
#splash .sp-barra{width:200px;height:12px;border:2px solid #fff;border-radius:6px;overflow:hidden}
#splash .sp-barra i{display:block;height:100%;width:40%;border-radius:3px;background:repeating-linear-gradient(-45deg,#FF7A00 0 8px,#FF8F2A 8px 16px);animation:sp-anda 1.1s ease-in-out infinite}
#splash .sp-dica{max-width:280px;min-height:3em;font:700 18px 'Kalam',cursive;color:#FFB46B;transform:rotate(-2deg)}
@keyframes sp-pula{from{transform:translateY(6px)}to{transform:translateY(-8px)}}
@keyframes sp-pulsa{50%{transform:scale(1.06)}}
@keyframes sp-anda{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#splash *,#splash *::before{animation:none!important}}
</style>

</head>
<body>
<div id="splash" aria-label="Carregando">
  <div class="sp-masc"><img src="mascote/sorrindo.webp" alt=""></div>
  <h1>Revisão <span>Delmão</span></h1>
  <div class="sp-barra"><i></i></div>
  <p class="sp-dica" id="sp-dica"></p>
</div>
<script>
// dica aleatória enquanto carrega; some quando a primeira tela aparece (mínimo 0,9 s para não piscar)
(function(){
  var dicas=['Dividir por 0? Nem tenta!','Multiplicação vem antes da soma.','Todo inteiro é racional.','Porcentagem é só uma fração de 100.','Errou? Ótimo: agora você aprende!','Uma lição por dia já faz diferença.'];
  document.getElementById('sp-dica').textContent=dicas[Math.floor(Math.random()*dicas.length)];
  var t0=Date.now();
  function sair(){var s=document.getElementById('splash');if(!s||s.classList.contains('sai'))return;
    setTimeout(function(){s.classList.add('sai');setTimeout(function(){s.remove()},400)},Math.max(0,900-(Date.now()-t0)));}
  document.addEventListener('DOMContentLoaded',function(){
    var r=document.getElementById('raiz');
    if(r.children.length) return sair();
    new MutationObserver(function(_,o){if(r.children.length){o.disconnect();sair();}}).observe(r,{childList:true});
    setTimeout(sair,8000); // nunca fica preso na tela de carregamento
  });
})();
</script>
<div id="raiz"></div>
<script src="config.js?v=20261120e"></script>
<script>
  // a biblioteca do Supabase só é carregada quando o banco está configurado
  if (window.CONFIG && CONFIG.supabaseUrl) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');
</script>

</body>
