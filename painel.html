<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="robots" content="noindex">
<title>Painel do Professor</title>
<link rel="icon" href="icone-192.png">
<link rel="stylesheet" href="estilo.css?v=20261115b">
<style>
  main{max-width:900px}
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 6px}
  .sec-p{background:#fff;border-radius:18px;padding:16px;margin-top:16px}
  .sec-p h2{margin-top:0}
  .linha{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--cinza)}
  .linha:first-of-type{border-top:0}
  .linha .t{font-weight:700}
  .linha small{color:#556;font-weight:400}
  .linha .pct{font:22px 'Anton',Impact,sans-serif;text-align:right}
  .linha .bar{grid-column:1/-1;height:8px;background:var(--cinza);border-radius:4px;overflow:hidden}
  .linha .bar i{display:block;height:100%;background:var(--verm)}
  .linha .acoes{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
  .mini{padding:8px 12px;font-size:14px;border-radius:10px;background:var(--azul)}
  .q{font-size:14px;margin-top:4px}
  textarea{width:100%;font:inherit;padding:12px;border:2px solid var(--cinza);border-radius:14px;min-height:90px}
  .aluno{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--cinza);font-size:14px;word-break:break-all}
  .aluno span{flex:1}
  .aluno button{background:none;color:var(--verm);padding:6px 8px;font-size:14px}
  .vazio{color:#556;font-size:14px}
  .filtro{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .filtro .sel{width:auto}
</style>
</head>
<body>
<header>
  <button onclick="location.href='./'" aria-label="Voltar ao app">←</button>
  <div class="marca">Painel do <span>professor</span></div>
</header>
<main id="m"><p>Carregando…</p></main>
<script src="config.js?v=20261115b"></script>
<script>
  if (window.CONFIG && CONFIG.supabaseUrl) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');
</script>
<script src="backend.js?v=20261121a"></script>
<script src="painel.js?v=20261121a"></script>
</body>
</html>
